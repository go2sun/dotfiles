# ---------- M4 视觉审计系统 (最终版 V2.4) ----------
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- 状态栏基础样式 ---
set -g status-interval 1
set -g status-justify centre
set -g status-left-length 40
# 初始状态：黄底红字
set -g status-left "#[fg=#d31269,bg=#e8c030,bold] #S #[default]"

# --- 核心同步切换逻辑 (绕过条件判断乱码) ---
# 按下 s 时：切换状态 + 手动切换颜色 + 强制刷新
bind s setw synchronize-panes \; \
    if-shell "tmux showw -v synchronize-panes | grep on" \
    "set -g status-left '#[fg=white,bg=red,bold] ⚠️ SYNC #[default]'" \
    "set -g status-left '#[fg=#d31269,bg=#e8c030,bold] #S #[default]'" \; \
    refresh-client -S

# 右侧样式
set -g status-right "#[fg=green,bg=black] 🖥️ M4 Audit #[fg=white,bg=black] %H:%M:%S #[default]"
setw -g window-status-current-style 'fg=#eeeeee bg=#427b58'

# 快捷重载
bind r source-file ~/.tmux.conf \; display "M4 系统配置已重载!"
