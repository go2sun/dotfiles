# ==============================================================================
# M4 视觉审计系统：状态灯美学配置
# ==============================================================================

# 开启状态栏刷新 (每 5 秒同步一次状态)
set -g status-interval 5

# 定义状态栏右侧：展示 CPU/MEM (线) 与 同步状态 (灯)
# 引用您当前的 C-s 前缀与鼠标基因
set -g status-right-length 100
set -g status-right "#[fg=blue]💎 M4 Audit #[fg=white]| #(cd ~/dotfiles && git status -s | grep -q '.' && echo '#[fg=red]● STAGED' || echo '#[fg=green]● SYNCED') #[fg=white]| #[fg=cyan]MEM:#(free -h | awk '/^Mem:/ {print $3}') #[fg=white]| #[fg=magenta]%H:%M:%S "

# 美学修正：确保背景色与您的暗色主题统一
set -g status-style "bg=default,fg=white"