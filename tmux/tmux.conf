# ==============================================================================
# M4 视觉审计系统 (最终版) - TMUX 核心
# ==============================================================================

# 1. 基础美学与性能
set -g status-bg black
set -g status-fg cyan
set -g status-interval 5     # 每 5 秒刷新一次同步状态

# 2. 状态栏左侧：注入 [M4-ONLINE] 标签
set -g status-left-length 50
set -g status-left "#[fg=green]  [M4-ONLINE] #[fg=yellow]» #[fg=cyan]#S "

# 3. 实时同步监控 (右侧状态栏)：动态检测 Git 状态
set -g status-right-length 100
set -g status-right "#[fg=blue]💎 M4 Audit #[fg=white]| #(cd ~/dotfiles && git status -s | grep -q '.' && echo '#[fg=red]● STAGED' || echo '#[fg=green]● SYNCED') #[fg=white]| #[fg=white]%Y-%m-%d %H:%M "

# 4. 交互基因：开启鼠标支持与快捷键
set -g mouse on
# 确保 tmux 继承系统 PATH (解决 brew/code 唤起问题)
set -g default-command "zsh"

# 快速重载配置
bind r source-file ~/.tmux.conf \; display "💎 M4 基因已重加载！"

# 5. AI 审计模式：Prefix + A 开启侧边栏
# 自动切分 30% 的右侧空间并启动 Gemini-CLI (或您常用的 AI)
bind A split-window -h -p 30 -c "#{pane_current_path}" "source ~/.zshrc; gemini-cli --interactive || zsh"

# 快速切换布局：Prefix + Space
bind -n M-f resize-pane -Z  # Alt + F 全屏/恢复当前审计窗格

# 备选专注模式：Prefix + z (Tmux 默认，但我们强化它)
bind z resize-pane -Z \; display "💎 专注模式切换"
