# --- 基础设置 ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# --- 通用视觉仪表盘 (无需特殊字体) ---
set -g status-interval 2
set -g status-style bg=#282a36,fg=#f8f8f2

# 左侧：系统名称
set -g status-left-length 30
set -g status-left "#[bg=#6272a4,fg=#ffffff,bold] M4-AUDIT #[bg=default,fg=#6272a4] >> #[fg=#f1fa8c]#S "

# 右侧：性能数据 (使用文字标签代替图标)
set -g status-right-length 100
set -g status-right "#[fg=#8be9fd] CPU: #{cpu_percentage} | #[fg=#50fa7b] MEM: #{ram_percentage} | #[fg=#ff79c6] %H:%M "

# 窗口标签 (当前激活窗口用中括号标注)
setw -g window-status-current-format "#[fg=#ff79c6,bold][ #I:#W ]"
setw -g window-status-format " #I:#W "

# 快捷键：Prefix + r 重载
bind r source-file ~/.tmux.conf \; display-message "审计系统配置已刷新"

# 初始化插件管理器
run '~/.tmux/plugins/tpm/tpm'
