# ========== [ tmux 合并配置 · M4/Ghostty 适配 ] ==========
# 真源: dotfiles/tmux/tmux.conf
# 合并自: 轻量版(tokyongight配色+TPM+vi导航) + M4审计版(前缀+同步高亮+剪贴板)

# --- 基础 ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g history-limit 5000
set -g mouse on

# --- prefix: 统一 Ctrl+A ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- 编号从 1 开始 ---
set -g base-index 1
setw -g pane-base-index 1

# --- 配色: tokyonight 柔和系 ---
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left " #[fg=#7aa2f7] #S "
set -g status-right " #[fg=#565f89] %H:%M #[fg=#7aa2f7] #h "
setw -g window-status-current-style "fg=#7dcfff,bold"

# --- 同步窗格高亮 (M4审计版逻辑, 简化颜色) ---
bind s setw synchronize-panes \
    \; if-shell 'tmux showw -v synchronize-panes | grep on' \
    'set -g status-left " #[fg=white,bg=red,bold] SYNC "' \
    'set -g status-left " #[fg=#7aa2f7] #S "' \
    \; refresh-client -S

# --- 快捷键增强 ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# vi 风格 pane 导航
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 重载配置
bind r source-file ~/.tmux.conf \; display "config reloaded"

# --- 会话持久化 (tpm) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
run '~/.tmux/plugins/tpm/tpm'

# --- macOS 剪贴板 ---
set -g default-command "reattach-to-user-namespace -l zsh"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
