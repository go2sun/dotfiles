# --- 基础插件 ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'

# --- M4 性能监控仪表盘 ---
set -g status-interval 2
set -g status-left-length 50
set -g status-right-length 150

# 修复方块：确保你已在终端设置中选择了 JetBrainsMono Nerd Font
set -g status-left "#[fg=black,bg=#bd93f9,bold]  M4 AUDIT #[fg=#bd93f9,bg=default] #[fg=#f8f8f2]#S #[fg=default] "

set -g status-right "#[fg=#8be9fd]#[fg=black,bg=#8be9fd]  #{cpu_percentage} #[fg=#50fa7b,bg=#8be9fd]#[fg=black,bg=#50fa7b]  #{ram_percentage} #[fg=#ff79c6,bg=#50fa7b]#[fg=black,bg=#ff79c6]  %H:%M "

# 快捷键重载
bind r source-file ~/.tmux.conf \; display-message "✅ 仪表盘已校准"

# 初始化 TPM (必须放在最后)
run '~/.tmux/plugins/tpm/tpm'
